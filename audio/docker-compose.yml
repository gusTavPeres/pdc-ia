services:
  pdc-audio:
    image: pdc-audio:${PDC_IMAGE_VARIANT:-cpu}
    build:
      context: ..
      dockerfile: audio/Dockerfile
    container_name: pdc-audio
    ports:
      - "127.0.0.1:8012:8000"
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
      - ../results:/app/results
      - ../shared:/app/shared:ro
      - /sys:/sys:ro
    environment:
      - PDC_FRONT=audio
      - PDC_GPU_MODE=${PDC_GPU_MODE:-cpu}
      - PDC_IMAGE_VARIANT=${PDC_IMAGE_VARIANT:-cpu}
      - PDC_HOST_TELEMETRY_PATH=/app/data/telemetry/host.json
    shm_size: ${PDC_SHM_SIZE:-256m}
    cpus: ${PDC_CPU_LIMIT:-0}
    mem_limit: ${PDC_MEMORY_LIMIT:-0}
    pids_limit: ${PDC_PIDS_LIMIT:--1}
    init: true
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
