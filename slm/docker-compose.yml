services:
  pdc-slm:
    build:
      context: ..
      dockerfile: slm/Dockerfile
    container_name: pdc-slm
    ports:
      - "8011:8000"
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
      - ../results:/app/results
      - ../shared:/app/shared:ro
      - /sys:/sys:ro
    environment:
      - PDC_FRONT=slm
      - PDC_GPU_MODE=auto
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: '256m'
    restart: unless-stopped
