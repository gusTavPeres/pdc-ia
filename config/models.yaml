vision:
  default: "yolov8n"
  models:
    yolov8n:
      format: "ultralytics"
      url: "https://github.com/ultralytics/assets/releases/download/v8.2.0/yolov8n.pt"
      size_mb: 6
      min_ram_gb: 2
      gpu_capable: true
      description: "YOLOv8 nano — detecção de objetos"

slm:
  default: "tinyllama-1.1b-q4"
  models:
    tinyllama-1.1b-q4:
      format: "gguf"
      url: "https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf"
      size_mb: 637
      min_ram_gb: 2
      gpu_capable: true
      gpu_layers: 33
      context_length: 2048
      chat_format: "tinyllama"
      description: "TinyLlama 1.1B Q4 — modelo base de comparação"
    qwen25-0.5b-q4:
      format: "gguf"
      url: "https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"
      size_mb: 397
      min_ram_gb: 1
      gpu_capable: true
      gpu_layers: 29
      context_length: 4096
      chat_format: "chatml"
      description: "Qwen2.5 0.5B Instruct Q4 — modelo menor/mais novo"

audio:
  asr:
    default: "whisper-small"
    models:
      whisper-small:
        format: "faster-whisper"
        model_id: "small"
        size_mb: 461
        min_ram_gb: 2
        gpu_capable: true
        languages: ["pt", "en"]
        description: "Whisper Small"
  tts:
    default: "piper-pt-br"
    models:
      piper-pt-br:
        format: "piper"
        config_url: "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json"
        model_url: "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx"
        size_mb: 63
        min_ram_gb: 1
        gpu_capable: false
        description: "Piper TTS pt-BR"
