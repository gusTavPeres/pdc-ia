services:
  pdc-vision:
    image: pdc-vision:${PDC_IMAGE_VARIANT:-vulkan}
    build:
      dockerfile: vision/Dockerfile.vulkan
    devices:
      - /dev/dri:/dev/dri
    group_add:
      # ponytail: GIDs render/video do HOST oculink. Outro host AMD -> conferir.
      - "992"   # render
      - "44"    # video
    environment:
      - PDC_GPU_MODE=auto
      - PDC_IMAGE_VARIANT=vulkan
      - PDC_GPU_BACKEND=vulkan
