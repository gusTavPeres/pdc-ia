services:
  pdc-vision:
    build:
      context: ..
      dockerfile: vision/Dockerfile
    container_name: pdc-vision
    ports:
      - "8010:8000"
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
      - ../results:/app/results
      - ../shared:/app/shared:ro
      - /sys:/sys:ro
    environment:
      - PDC_FRONT=vision
      - PDC_GPU_MODE=${PDC_GPU_MODE:-auto}
    shm_size: '256m'
    restart: unless-stopped
