services:
  pdc-vision:
    image: pdc-vision:${PDC_IMAGE_VARIANT:-gpu}
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
    gpus: all
    environment:
      - PDC_GPU_MODE=auto
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
